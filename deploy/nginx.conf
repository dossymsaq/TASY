# nginx: Жеткіз 750. DOMAIN заменяется скриптом setup.sh. HTTPS добавляет certbot.
limit_req_zone $binary_remote_addr zone=jetkiz_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Вход и запрос SMS-кода — дополнительное ограничение частоты
    location /api/auth/ {
        limit_req zone=jetkiz_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/jetkiz750-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/jetkiz750-proxy.conf;
    }
}
